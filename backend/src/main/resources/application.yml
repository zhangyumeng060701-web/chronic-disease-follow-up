server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/follow_up?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:follow_up_2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

knife4j:
  enable: true
  setting:
    language: zh-CN

jwt:
  secret: ${JWT_SECRET:chronic-disease-follow-up-secret-key-2026-challenge-cup}
  expiration: ${JWT_EXPIRATION:86400000}

data:
  encryption:
    key: ${DATA_ENCRYPTION_KEY:}

agent:
  arts:
    api-key: ${AGENT_ARTS_API_KEY:}
    session-id: ${AGENT_ARTS_SESSION_ID:}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
