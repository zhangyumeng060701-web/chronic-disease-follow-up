name: Quality Gate

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DB_PASSWORD: ci-only-password
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Run backend tests
        run: mvn --batch-mode clean test
      - name: Publish backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-target/package-lock.json
      - name: Install clean dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Block high-severity dependency vulnerabilities
        run: npm audit --audit-level=high
